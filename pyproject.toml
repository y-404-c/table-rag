[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tablerag"
version = "0.1.0"
description = "表格文档 RAG Agent：结构化表格解析 + 双路召回 + LangGraph 编排 + cell 级溯源"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "pypdf>=4.2",
    "reportlab>=4.1",
    "pandas>=2.2",
    "rank-bm25>=0.2.2",
    "chromadb>=0.5",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
tr = "tablerag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
